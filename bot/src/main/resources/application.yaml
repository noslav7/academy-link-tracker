server:
  port: 8080

spring:
  application:
    name: bot
  config:
    import: optional:file:./bot/.env[.properties],optional:file:./.env[.properties]

app:
  telegram:
    url: https://api.telegram.org/bot
    token: ${TELEGRAM_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
    update-listener-sleep: 1s
    debug: false
  scrapper:
    base-url: ${SCRAPPER_BASE_URL:http://localhost:8081}
    transport: ${SCRAPPER_TRANSPORT:HTTP}
    grpc-host: ${SCRAPPER_GRPC_HOST:localhost}
    grpc-port: ${SCRAPPER_GRPC_PORT:9091}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    schema-registry-url: ${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8085/apis/registry/v2}
    topic: ${KAFKA_TOPIC:link-updates}
    dlq-topic: ${KAFKA_DLQ_TOPIC:link-updates-dlq}
    group-id: ${KAFKA_GROUP_ID:bot-link-updates}
    client-id: ${KAFKA_CLIENT_ID:bot}
    retry-attempts: ${KAFKA_RETRY_ATTEMPTS:3}
    retry-backoff-ms: ${KAFKA_RETRY_BACKOFF_MS:1000}
  grpc:
    server:
      enabled: ${BOT_GRPC_SERVER_ENABLED:false}
      port: ${BOT_GRPC_SERVER_PORT:9090}
