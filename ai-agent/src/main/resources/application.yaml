server:
  port: 8082

spring:
  application:
    name: ai-agent
  config:
    import: optional:file:./ai-agent/.env[.properties],optional:file:./.env[.properties]

app:
  kafka:
    enabled: ${APP_KAFKA_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    raw-topic: ${KAFKA_RAW_TOPIC:link.raw-updates}
    processed-topic: ${KAFKA_PROCESSED_TOPIC:link.processed-updates}
    group-id: ${KAFKA_GROUP_ID:ai-agent-link-raw-updates}
    client-id: ${KAFKA_CLIENT_ID:ai-agent}
    auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}

ai-agent:
  filtering:
    stop-words: ${AI_AGENT_FILTERING_STOP_WORDS:spam,ads,promo}
    excluded-authors: ${AI_AGENT_FILTERING_EXCLUDED_AUTHORS:bot-user}
    min-length: ${AI_AGENT_FILTERING_MIN_LENGTH:20}
  prioritization:
    high-keywords: ${AI_AGENT_PRIORITIZATION_HIGH_KEYWORDS:critical,urgent,breaking,security}
    low-keywords: ${AI_AGENT_PRIORITIZATION_LOW_KEYWORDS:minor,typo,chore,docs}
  grouping:
    window-ms: ${AI_AGENT_GROUPING_WINDOW_MS:30000}
  summarization:
    threshold: ${AI_AGENT_SUMMARIZATION_THRESHOLD:500}
    api-url: ${AI_AGENT_SUMMARIZATION_API_URL:https://api-inference.huggingface.co/models/facebook/bart-large-cnn}
    api-token: ${AI_AGENT_SUMMARIZATION_API_TOKEN:}
    prompt: ${AI_AGENT_SUMMARIZATION_PROMPT:Summarize the following update in 2-3 sentences.}
    timeout: ${AI_AGENT_SUMMARIZATION_TIMEOUT:30s}
