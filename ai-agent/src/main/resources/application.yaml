server:
  port: 8082

spring:
  application:
    name: ai-agent
  config:
    import: optional:file:./ai-agent/.env[.properties],optional:file:./.env[.properties]

ai-agent:
  filtering:
    stop-words: ${AI_AGENT_FILTERING_STOP_WORDS:spam,ads,promo}
    excluded-authors: ${AI_AGENT_FILTERING_EXCLUDED_AUTHORS:bot-user}
    min-length: ${AI_AGENT_FILTERING_MIN_LENGTH:20}
  summarization:
    threshold: ${AI_AGENT_SUMMARIZATION_THRESHOLD:500}
