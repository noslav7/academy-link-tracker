services:
  postgresql:
    image: postgres:17
    container_name: link-tracker-postgres
    environment:
      POSTGRES_DB: link_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d link_tracker"]
      interval: 5s
      timeout: 3s
      retries: 20

  liquibase-migrations:
    image: liquibase/liquibase:4.29
    container_name: link-tracker-migrations
    depends_on:
      postgresql:
        condition: service_healthy
    command:
      - --searchPath=/changesets
      - --changelog-file=master.xml
      - --driver=org.postgresql.Driver
      - --url=jdbc:postgresql://postgresql:5432/link_tracker
      - --username=postgres
      - --password=postgres
      - update
    volumes:
      - ./migrations:/changesets

  kafka-1:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: link-tracker-kafka-1
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_KRAFT_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 2
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 2
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:19092"
    volumes:
      - kafka-1-data:/bitnami/kafka

  kafka-2:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: link-tracker-kafka-2
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_KRAFT_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_NODE_ID: 2
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:9093"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 2
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 2
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9093:19092"
    volumes:
      - kafka-2-data:/bitnami/kafka

  kafka-3:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: link-tracker-kafka-3
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_KRAFT_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_NODE_ID: 3
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 2
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 2
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9094:19092"
    volumes:
      - kafka-3-data:/bitnami/kafka

  schema-registry:
    image: apicurio/apicurio-registry-mem:2.6.13.Final
    container_name: link-tracker-schema-registry
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    environment:
      QUARKUS_HTTP_PORT: 8080
    ports:
      - "8085:8080"

  valkey-node-1:
    image: valkey/valkey:8-alpine
    container_name: link-tracker-valkey-node-1
    command: >
      valkey-server
      --port 6379
      --bind 0.0.0.0
      --protected-mode no
      --appendonly yes
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-hostname valkey-node-1
      --cluster-announce-port 6379
    ports:
      - "6379:6379"
    volumes:
      - valkey-node-1-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey-node-2:
    image: valkey/valkey:8-alpine
    container_name: link-tracker-valkey-node-2
    command: >
      valkey-server
      --port 6379
      --bind 0.0.0.0
      --protected-mode no
      --appendonly yes
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-hostname valkey-node-2
      --cluster-announce-port 6379
    ports:
      - "6380:6379"
    volumes:
      - valkey-node-2-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey-node-3:
    image: valkey/valkey:8-alpine
    container_name: link-tracker-valkey-node-3
    command: >
      valkey-server
      --port 6379
      --bind 0.0.0.0
      --protected-mode no
      --appendonly yes
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-hostname valkey-node-3
      --cluster-announce-port 6379
    ports:
      - "6381:6379"
    volumes:
      - valkey-node-3-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey-cluster-init:
    image: valkey/valkey:8-alpine
    container_name: link-tracker-valkey-cluster-init
    depends_on:
      valkey-node-1:
        condition: service_healthy
      valkey-node-2:
        condition: service_healthy
      valkey-node-3:
        condition: service_healthy
    restart: "no"
    command: >
      sh -c "
      if valkey-cli -h valkey-node-1 cluster info | grep -q 'cluster_state:ok'; then
        echo 'Valkey cluster is already initialized';
      else
        valkey-cli --cluster create
        valkey-node-1:6379
        valkey-node-2:6379
        valkey-node-3:6379
        --cluster-replicas 2
        --cluster-yes;
      fi
      "

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  valkey-node-1-data:
  valkey-node-2-data:
  valkey-node-3-data:
