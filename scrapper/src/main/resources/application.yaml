server:
  port: 8081

spring:
  application:
    name: scrapper
  config:
    import: optional:file:./scrapper/.env[.properties],optional:file:./.env[.properties]
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/link_tracker}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: ${LIQUIBASE_CHANGELOG:classpath:migrations/master.xml}
  data:
    redis:
      client-type: lettuce
      cluster:
        nodes: ${VALKEY_CLUSTER_NODES:localhost:6379}
      timeout: ${VALKEY_TIMEOUT:2s}
      lettuce:
        cluster:
          refresh:
            adaptive: true
            period: ${VALKEY_CLUSTER_REFRESH_PERIOD:30s}

app:
  database:
    access-type: ${ACCESS_TYPE:SQL}
  stackoverflow:
    key: ${STACKOVERFLOW_KEY:} # Use env variable. DO NOT KEEP TOKEN HERE
    access-token: ${STACKOVERFLOW_ACCESS_KEY:} # Use env variable. DO NOT KEEP TOKEN HERE
    base-url: ${STACKOVERFLOW_BASE_URL:https://api.stackexchange.com/2.3}
  github:
    token: ${GITHUB_TOKEN:} # Use env variable. DO NOT KEEP TOKEN HERE
    base-url: ${GITHUB_BASE_URL:https://api.github.com}
  bot:
    base-url: ${BOT_BASE_URL:http://localhost:8080}
    transport: ${BOT_TRANSPORT:KAFKA}
    grpc-host: ${BOT_GRPC_HOST:localhost}
    grpc-port: ${BOT_GRPC_PORT:9090}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    schema-registry-url: ${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8085/apis/registry/v2}
    topic: ${KAFKA_TOPIC:link-updates}
    client-id: ${KAFKA_CLIENT_ID:scrapper}
  scheduler:
    interval: ${SCRAPPER_SCHEDULER_INTERVAL:30s}
    batch-size: ${SCRAPPER_SCHEDULER_BATCH_SIZE:100}
    thread-count: ${SCRAPPER_SCHEDULER_THREAD_COUNT:4}
  outbox:
    publish-interval: ${OUTBOX_PUBLISH_INTERVAL:1s}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
  grpc:
    server:
      enabled: ${SCRAPPER_GRPC_SERVER_ENABLED:false}
      port: ${SCRAPPER_GRPC_SERVER_PORT:9091}
  cache:
    links:
      enabled: ${LINKS_CACHE_ENABLED:true}
      mode: ${LINKS_CACHE_MODE:CLIENT_SIDE}
      ttl: ${LINKS_CACHE_TTL:5m}
